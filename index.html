<!-- ============================================================
     FORMSPREE: reemplazar FORMSPREE_ID por el ID real del formulario
     (ej. https://formspree.io/f/abcdwxyz). Mientras diga FORMSPREE_ID
     el formulario NO envía nada (app.js lo detecta).

<form id="wl" action="https://formspree.io/f/FORMSPREE_ID" method="POST" novalidate>
<input type="text" name="name" required minlength="2" maxlength="80" autocomplete="name" data-ph="f_n" data-al="f_n">

<input type="text" name="country" required maxlength="60" autocomplete="country-name" data-ph="f_c" data-al="f_c">
<select name="age_range" required data-al="f_a"><option value="" data-i="a0"></option><option value="18-24">18–24</option><option value="25-29">25–29</option><option value="30-34">30–34</option><option value="35-39">35–39</option><option value="40+">40+</option></select>
<select name="type" data-al="f_t"><option value="young" data-i="o1"></option><option value="brand" data-i="o2"></option><option value="gov" data-i="o3"></option><option value="employer" data-i="o4"></option></select>
<input type="hidden" name="lang" value="es"><input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
<button class="btn" type="submit" data-i="f_b"></button></form>
